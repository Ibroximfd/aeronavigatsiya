name: aeronavigatsiya
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  # ---------------------------
  # 🧱 Flutter SDK
  # ---------------------------
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ---------------------------
  # 🎨 UI & Animations
  # ---------------------------
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  shimmer: ^3.0.0
  flutter_screenutil: ^5.9.3
  lottie: ^3.3.2

  # ---------------------------
  # 📦 State Management
  # ---------------------------
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # ---------------------------
  # 🔥 Firebase & Backend
  # ---------------------------
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  firebase_storage: ^13.0.2
  firebase_database: ^12.0.2
  cloud_firestore: ^6.0.2

  # ---------------------------
  # 📁 Files, Media & Network
  # ---------------------------
  file_picker: ^10.3.3
  image_picker: ^1.2.0
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.0.0

  # ---------------------------
  # 🌐 External Tools & Sharing
  # ---------------------------
  url_launcher: ^6.3.2
  share_plus: ^12.0.0
  youtube_player_flutter: ^9.1.1
  uuid: ^4.5.1

  # ---------------------------
  # 📝 Rich Text & Input Tools
  # ---------------------------

  # ---------------------------
  # ⚙️ Utilities
  # ---------------------------
  shared_preferences: ^2.5.3
  intl: ^0.20.2

  #html parser
  permission_handler: ^12.0.1
  in_app_update: ^4.2.5
  syncfusion_flutter_pdfviewer: ^31.2.5

  
  


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.5.0


flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_log.png  

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
